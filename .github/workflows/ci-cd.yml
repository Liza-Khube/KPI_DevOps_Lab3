name: CI Pipeline

on:
  push:
    branches: [main]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: mywebapp/package-lock.json

      - name: Install dependencies
        working-directory: ./mywebapp
        run: npm ci

      - name: Lint ESLint
        working-directory: ./mywebapp
        run: npm run lint

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: mywebapp/Dockerfile

      - name: Install shellcheck
        run: sudo apt-get install -y -qq shellcheck

      - name: Lint shell-files
        run: |
          shellcheck deploy/setup-runner.sh
          shellcheck deploy/setup-target.sh

      - name: Lint JSON files
        run: jq empty mywebapp/package.json

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: mywebapp/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: mywebapp

      - name: Run tests with coverage
        run: npm test
        working-directory: mywebapp

      - name: Upload coverage report
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: mywebapp/coverage/
          retention-days: 14

  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=long,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./mywebapp
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to production
    runs-on: [self-hosted, linux]
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make verification script executable
        run: chmod +x ./deploy/verify.sh

      - name: Deploy on target node
        run: |
          ssh -o StrictHostKeyChecking=no \
              "operator@${{ secrets.TARGET_NODE_IP }}" "
            set -e
            docker pull ghcr.io/${{ github.repository }}:stable
            sudo systemctl restart mywebapp-container.service
            sudo systemctl status mywebapp-container.service --no-pager
          "

      - name: Wait for service to start
        run: sleep 10

      - name: Run verification
        run: ./deploy/verify.sh "${{ secrets.TARGET_NODE_IP }}"
